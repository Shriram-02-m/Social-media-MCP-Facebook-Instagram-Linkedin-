services:
  - type: web
    name: social-media-cloud-worker
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run worker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCHEDULER_MODE
        value: cloud
      - key: TOKEN_STORE_BACKEND
        value: supabase
      - key: SCHEDULED_IMAGE_STORAGE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUD_TOKEN_ENCRYPTION_KEY
        sync: false
      # Encrypts/decrypts user-owned Developer App secrets. Must match the value on
      # Vercel (which encrypts on save); the worker decrypts during the OAuth code
      # exchange and LinkedIn token refresh.
      - key: APP_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: WORKER_TRIGGER_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      # Public HTML/HTTPS OAuth callbacks (Facebook, Instagram, LinkedIn).
      - key: OAUTH_CALLBACK_MODE
        value: cloud
      - key: OAUTH_REDIRECT_BASE_URL
        value: https://social-media-cloud-worker.onrender.com
      # Deployed Vercel frontend origin. Set this in the Render dashboard once the
      # production frontend URL is known; the callback redirects to /accounts there.
      - key: OAUTH_FRONTEND_BASE_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
